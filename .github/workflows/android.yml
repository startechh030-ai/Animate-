name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # Exec bits can be lost when files are transferred to GitHub
      # (zip downloads, web uploads, Windows checkouts). Re-assert it.
      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # The template signs release builds with the debug keystore, so this
      # APK is directly installable for testing. Swap in a real keystore
      # (via secrets) before store release.
      - name: Upload APK artifact (kept 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: animatelr-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
